<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>正在打开千问...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fb;
      color: #1f2329;
    }
    .box {
      width: min(92vw, 460px);
      text-align: center;
      padding: 36px 28px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .10);
    }
    .loader {
      width: 42px;
      height: 42px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #1677ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #5f6673; line-height: 1.7; margin: 8px 0; }
    .actions { display: grid; gap: 10px; margin-top: 20px; }
    .btn, .secondary-btn {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      text-decoration: none;
      border: 0;
      font-size: 16px;
      cursor: pointer;
    }
    .btn { background: #1677ff; color: #fff; }
    .secondary-btn { background: #eef4ff; color: #165dff; }
    .debug {
      margin-top: 14px;
      padding: 10px;
      border-radius: 10px;
      background: #f7f8fa;
      color: #6b7280;
      font-size: 12px;
      word-break: break-all;
      text-align: left;
    }
    .wechat-mask[hidden] { display: none; }
    .wechat-mask {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, .82);
      color: #fff;
      padding: max(28px, env(safe-area-inset-top)) 22px 22px;
    }
    .arrow {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 22px;
      font-size: 64px;
      line-height: 1;
      transform: rotate(-8deg);
    }
    .mask-card {
      margin: 96px auto 0;
      width: min(92vw, 420px);
      padding: 24px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(10px);
    }
    .mask-card h2 { margin: 0 0 12px; font-size: 22px; }
    .mask-card p { color: rgba(255,255,255,.88); }
    .mask-btn {
      display: block;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff;
      color: #111827;
      text-decoration: none;
      text-align: center;
      font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="box">
    <div class="loader" id="loader"></div>
    <h1 id="title">正在打开千问...</h1>
    <p id="status-text">正在解析链接参数。</p>

    <div class="actions">
      <a class="btn" id="fallback-link" href="#" rel="noopener noreferrer">
        打开还原后的链接
      </a>
      <button class="secondary-btn" id="copy-link" type="button">
        复制原始跳转链接
      </button>
    </div>

    <div class="debug" id="debug-url" hidden></div>
  </main>

  <section class="wechat-mask" id="wechat-mask" hidden>
    <div class="arrow">↗</div>
    <div class="mask-card">
      <h2>请在浏览器中打开</h2>
      <p>微信内置浏览器会拦截千问 App 的 intent 链接。</p>
      <p>请点击右上角「···」，选择「在浏览器打开」。</p>
      <p>打开到系统浏览器后，本页会自动尝试唤起千问；若未自动唤起，请点页面里的「打开还原后的链接」。</p>
      <a class="mask-btn" id="mask-copy-link" href="#">复制当前链接</a>
    </div>
  </section>

  <script>
    const CACHE_KEY = 'tongyi_jump_q';
    const CACHE_TIME_KEY = 'tongyi_jump_q_time';
    const CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
    const MAX_PROMPT_LENGTH = 500;
    const FALLBACK_URL = 'https://m.tongyi.com/app/tongyi/tongyi-hybrid/download-guide';

    const params = new URLSearchParams(window.location.search);
    const ua = navigator.userAgent || '';
    const isWechat = /MicroMessenger/i.test(ua);

    const title = document.getElementById('title');
    const statusText = document.getElementById('status-text');
    const fallbackLink = document.getElementById('fallback-link');
    const copyLink = document.getElementById('copy-link');
    const debugUrl = document.getElementById('debug-url');
    const wechatMask = document.getElementById('wechat-mask');
    const maskCopyLink = document.getElementById('mask-copy-link');

    function decodeSafely(value) {
      try {
        return decodeURIComponent(value);
      } catch (_) {
        return value;
      }
    }

    function normalizeText(value) {
      let current = String(value || '').trim();

      for (let i = 0; i < 2; i += 1) {
        const next = decodeSafely(current).trim();
        if (next === current) break;
        current = next;
      }

      return current;
    }

    function extractInputTextFromDeepLink(value) {
      const text = String(value || '');
      const match = text.match(/[?&]inputText=([^&#;]*)/i);
      return match ? normalizeText(match[1]) : '';
    }

    function getCachedPrompt() {
      const ts = Number(
        sessionStorage.getItem(CACHE_TIME_KEY) ||
        localStorage.getItem(CACHE_TIME_KEY) ||
        0
      );

      if (!ts || Date.now() - ts > CACHE_MAX_AGE_MS) {
        return '';
      }

      return sessionStorage.getItem(CACHE_KEY) || localStorage.getItem(CACHE_KEY) || '';
    }

    function cachePrompt(prompt) {
      if (!prompt) return;

      const now = String(Date.now());

      try {
        sessionStorage.setItem(CACHE_KEY, prompt);
        sessionStorage.setItem(CACHE_TIME_KEY, now);
        localStorage.setItem(CACHE_KEY, prompt);
        localStorage.setItem(CACHE_TIME_KEY, now);
      } catch (_) {}
    }

    function readPrompt() {
      let prompt = params.get('q') || params.get('inputText') || '';

      if (!prompt) {
        prompt = extractInputTextFromDeepLink(
          params.get('intent') ||
          params.get('target') ||
          params.get('url') ||
          ''
        );
      }

      prompt = normalizeText(prompt) || getCachedPrompt();
      prompt = prompt.slice(0, MAX_PROMPT_LENGTH);

      cachePrompt(prompt);
      return prompt;
    }

    function buildIntentUrl(prompt) {
      const encodedPrompt = encodeURIComponent(prompt);
      const fallback = encodeURIComponent(FALLBACK_URL);

      return `intent://page/chat?tab=mainChat&inputText=${encodedPrompt}#Intent;scheme=tongyi;S.browser_fallback_url=${fallback};end`;
    }

    function buildShareUrl(prompt) {
      const url = new URL(window.location.origin + window.location.pathname);
      url.searchParams.set('q', prompt);
      return url.toString();
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }

      const input = document.createElement('textarea');
      input.value = text;
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();

      return Promise.resolve();
    }

    const prompt = readPrompt();
    const shareUrl = prompt ? buildShareUrl(prompt) : window.location.href;
    const intentUrl = prompt ? buildIntentUrl(prompt) : '';

    if (!prompt) {
      title.textContent = '缺少购票参数';
      statusText.textContent = '链接中没有 q 参数，也没有可用缓存。请重新打开带 q 参数的原始链接。';

      fallbackLink.removeAttribute('href');
      fallbackLink.style.pointerEvents = 'none';
      fallbackLink.style.opacity = '.55';
    } else {
      fallbackLink.href = intentUrl;

      debugUrl.hidden = false;
      debugUrl.textContent = intentUrl;

      copyLink.addEventListener('click', () => {
        copyText(intentUrl).then(() => {
          copyLink.textContent = '已复制';
        });
      });

      maskCopyLink.addEventListener('click', (event) => {
        event.preventDefault();

        copyText(shareUrl).then(() => {
          maskCopyLink.textContent = '已复制，去右上角选择浏览器打开';
        });
      });

      if (isWechat) {
        title.textContent = '微信内需要外部浏览器';
        statusText.textContent = '已缓存参数。请按遮罩提示从右上角选择「在浏览器打开」。';
        wechatMask.hidden = false;
      } else {
        title.textContent = '正在唤起千问 App...';
        statusText.textContent = '已还原为千问 intent 链接。若未自动跳转，请点击下方按钮。';

        window.location.href = intentUrl;
      }
    }
  </script>
</body>
</html>
