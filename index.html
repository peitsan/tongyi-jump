<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>正在打开千问...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { text-align: center; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .loader { width: 40px; height: 40px; border: 3px solid #eee; border-top: 3px solid #1677ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #666; margin: 0; }
    .actions { margin-top: 16px; display: none; }
    .link-btn { display: inline-block; padding: 10px 14px; border-radius: 10px; background: #1677ff; color: #fff; text-decoration: none; word-break: break-all; }
  </style>
</head>
<body>
  <div class="box">
    <div class="loader"></div>
    <p id="status-text">正在打开千问...</p>
    <div class="actions" id="actions">
      <a class="link-btn" id="fallback-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开还原后的链接">打开还原后的链接</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const rawInput = params.get('url') || params.get('intent') || params.get('target') || params.get('q') || '';
    const SITE_URL = 'https://peitsan.github.io/tongyi-jump/';
    const statusText = document.getElementById('status-text');
    const actions = document.getElementById('actions');
    const fallbackLink = document.getElementById('fallback-link');
    const MAX_DECODE_ITERATIONS = 3;
    const INTENT_SCHEME_PATTERN = /^intent:\/\//i;
    const INTENT_PREFIX_PATTERN = /^intent:/i;
    const HTTPS_SCHEME_PATTERN = /^https$/i;

    const decodeSafely = (value) => {
      try { return decodeURIComponent(value); } catch {
        console.warn('Redirect parameter contains malformed encoding, falling back to raw value.');
        return value;
      }
    };

    const normalizeInput = (value) => {
      let current = (value || '').trim();
      for (let i = 0; i < MAX_DECODE_ITERATIONS; i++) {
        const next = decodeSafely(current);
        if (next === current) break;
        current = next.trim();
      }
      return current;
    };

    const parseFallbackUrl = (value) => {
      const normalized = normalizeInput(value);
      if (normalized) {
        try {
          const url = new URL(normalized);
          if (url.protocol === 'https:' || url.protocol === 'http:') return url.toString();
        } catch (error) {
          console.warn('fallback input is not a standard URL, trying as q parameter.', error);
        }
        const restored = new URL(SITE_URL);
        restored.searchParams.set('q', normalized);
        return restored.toString();
      }
      return SITE_URL;
    };

    const parseIntentToHttps = (value) => {
      if (!value) return null;
      let link = normalizeInput(value);

      if (INTENT_SCHEME_PATTERN.test(link)) {
        const marker = /#intent;/i.exec(link);
        const markerIndex = marker ? marker.index : -1;
        const prefix = markerIndex >= 0 ? link.slice(0, markerIndex) : link;
        const intentPart = markerIndex >= 0 ? link.slice(markerIndex + marker[0].length) : '';
        const path = prefix.replace(INTENT_SCHEME_PATTERN, '');
        let scheme = 'https';
        const cleaned = intentPart.replace(/;end$/i, '');
        for (const segment of cleaned.split(';')) {
          if (segment.startsWith('scheme=')) {
            scheme = segment.slice('scheme='.length);
            break;
          }
        }
        if (!HTTPS_SCHEME_PATTERN.test(scheme)) {
          console.warn(`Unsupported scheme "${scheme}" in intent link, force to https.`);
          scheme = 'https';
        }
        link = `${scheme.toLowerCase()}://${path}`;
      } else if (INTENT_PREFIX_PATTERN.test(link)) {
        link = link.replace(INTENT_PREFIX_PATTERN, 'https:');
      }

      try {
        const url = new URL(link);
        if (url.protocol === 'http:') url.protocol = 'https:';
        if (url.protocol !== 'https:') return null;
        const host = url.hostname.toLowerCase();
        if (host === 'tongyi.com' || host.endsWith('.tongyi.com')) return url.toString();
      } catch (error) {
        console.warn('Invalid redirect URL after intent conversion, using fallback.', error);
      }
      return null;
    };

    const fallback = parseFallbackUrl(rawInput);
    const target = parseIntentToHttps(rawInput);
    if (target) {
      window.location.replace(target);
    } else {
      fallbackLink.href = fallback;
      fallbackLink.title = fallback;
      statusText.textContent = '未识别到可直接跳转的千问链接，请在浏览器中打开或使用下面还原后的链接。';
      actions.style.display = 'block';
    }
  </script>
</body>
</html>
